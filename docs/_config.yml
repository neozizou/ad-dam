# Configuración de la web (GitHub Pages con Jekyll y el tema Just the Docs)
title: Acceso a Datos · 2.º DAM
description: Apuntes del módulo Acceso a Datos del CFGS Desarrollo de Aplicaciones Multiplataforma. Curso 2026-2027.
lang: es

remote_theme: just-the-docs/just-the-docs@v0.9.0
plugins:
  - jekyll-remote-theme

color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Volver arriba"
footer_content: "Acceso a Datos · 2.º DAM · Curso 2026-2027"

kramdown:
  toc_levels: 2..2

# Los ejemplos se publican como ficheros descargables, pero no aparecen en el menú ni en el buscador
defaults:
  - scope:
      path: "ud0/ejemplos"
    values:
      nav_exclude: true
      search_exclude: true
  - scope:
      path: "ud1/ejemplos"
    values:
      nav_exclude: true
      search_exclude: true
  - scope:
      path: "ud2/ejemplos"
    values:
      nav_exclude: true
      search_exclude: true
