A35F00" stroke-width="1.6" stroke-dasharray="none"/></marker><marker id="t-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L11,6 L0,12 z" fill="#FFFFFF" stroke="#A35F00" stroke-width="1.4" stroke-dasharray="none"/></marker><marker id="d-amber" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#A35F00"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3949A0"/></marker><marker id="o-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#3949A0" stroke-width="1.6" stroke-dasharray="none"/></marker><marker id="t-indigo" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L11,6 L0,12 z" fill="#FFFFFF" stroke="#3949A0" stroke-width="1.4" stroke-dasharray="none"/></marker><marker id="d-indigo" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#3949A0"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A83A3A"/></marker><marker id="o-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#A83A3A" stroke-width="1.6" stroke-dasharray="none"/></marker><marker id="t-rose" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L11,6 L0,12 z" fill="#FFFFFF" stroke="#A83A3A" stroke-width="1.4" stroke-dasharray="none"/></marker><marker id="d-rose" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#A83A3A"/></marker></defs><rect x="20" y="20" width="1000" height="200" rx="10" fill="#F8E3E3" fill-opacity="0.35" stroke="#A83A3A" stroke-width="1.2"/><text x="36" y="46" font-size="14" fill="#A83A3A" text-anchor="start" font-weight="700">Concatenando texto: lo que escribe el usuario pasa a formar parte de la sentencia</text><text x="36" y="76" font-size="12.5" fill="#5C6B7A" text-anchor="start" font-weight="700">Código:</text><text x="120" y="76" font-size="12" fill="#1E2933" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" textLength="316.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">"SELECT … FROM producto WHERE codigo = '" + </text><rect x="438.8" y="62" width="45.2" height="20" rx="2" fill="#F8E3E3" stroke="#A83A3A" stroke-width="1"/><text x="439.8" y="76" font-size="12" fill="#1E2933" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" textLength="43.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">codigo</text><text x="486.0" y="76" font-size="12" fill="#1E2933" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" textLength="43.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> + "'"</text><text x="36" y="108" font-size="12.5" fill="#5C6B7A" text-anchor="start" font-weight="700">Usuario:</text><rect x="119" y="94" width="376.40000000000003" height="20" rx="2" fill="#F8E3E3" stroke="#A83A3A" stroke-width="1"/><text x="120" y="108" font-size="12" fill="#1E2933" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" textLength="374.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">x' UNION SELECT email, nombre, 0, 0 FROM cliente -- </text><text x="36" y="140" font-size="12.5" fill="#5C6B7A" text-anchor="start" font-weight="700">Se envía:</text><text x="120" y="140" font-size="12" fill="#1E2933" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" textLength="482.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">SELECT codigo, nombre, precio, stock FROM producto WHERE codigo = '</text><rect x="604.4000000000001" y="126" width="376.40000000000003" height="20" rx="2" fill="#F8E3E3" stroke="#A83A3A" stroke-width="1"/><text x="605.4000000000001" y="140" font-size="12" fill="#1E2933" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" textLength="374.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">x' UNION SELECT email, nombre, 0, 0 FROM cliente -- </text><text x="982.8000000000002" y="140" font-size="12" fill="#1E2933" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" textLength="7.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">'</text><text x="120" y="172" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">La comilla del usuario cierra el texto y el resto se convierte en SQL: la consulta devuelve</text><text x="120" y="191" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">los correos de todos los clientes. El -- final convierte en comentario la comilla que sobraba.</text><rect x="20" y="240" width="1000" height="190" rx="10" fill="#E3F1F1" fill-opacity="0.35" stroke="#0E6F72" stroke-width="1.2"/><text x="36" y="266" font-size="14" fill="#0E6F72" text-anchor="start" font-weight="700">Con PreparedStatement: la sentencia y los valores viajan por separado</text><rect x="36" y="284" width="26" height="26" rx="13.0" fill="#FFFFFF" stroke="#0E6F72" stroke-width="1.5"/><text x="49.0" y="301.375" font-size="12.5" fill="#1E2933" text-anchor="middle" font-weight="700">1</text><text x="74" y="302" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">prepareStatement: el gestor recibe y analiza la sentencia, con un hueco ? para cada valor</text><text x="120" y="330" font-size="12" fill="#1E2933" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" textLength="475.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">SELECT codigo, nombre, precio, stock FROM producto WHERE codigo = </text><rect x="597.2" y="316" width="9.2" height="20" rx="2" fill="#E3F1F1" stroke="#0E6F72" stroke-width="1"/><text x="598.2" y="330" font-size="12" fill="#1E2933" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" textLength="7.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">?</text><rect x="36" y="348" width="26" height="26" rx="13.0" fill="#FFFFFF" stroke="#0E6F72" stroke-width="1.5"/><text x="49.0" y="365.375" font-size="12.5" fill="#1E2933" text-anchor="middle" font-weight="700">2</text><text x="74" y="366" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">setString(1, …): el valor llega después y solo puede ocupar el hueco, como dato</text><rect x="119" y="380" width="9.2" height="20" rx="2" fill="#E3F1F1" stroke="#0E6F72" stroke-width="1"/><text x="120" y="394" font-size="12" fill="#1E2933" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" textLength="7.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">?</text><text x="130.2" y="394" font-size="12" fill="#1E2933" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" textLength="36.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  =  </text><rect x="168.2" y="380" width="390.8" height="20" rx="2" fill="#E3F1F1" stroke="#0E6F72" stroke-width="1"/><text x="169.2" y="394" font-size="12" fill="#1E2933" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" textLength="388.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">"x' UNION SELECT email, nombre, 0, 0 FROM cliente -- "</text><text x="120" y="418" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400" font-style="italic">Se busca un producto cuyo código sea literalmente ese texto: 0 filas.</text></svg>
