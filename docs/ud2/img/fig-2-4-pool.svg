c</text><rect x="30" y="262" width="220" height="46" rx="8" fill="#FFFFFF" stroke="#1E2933" stroke-width="1.5"/><text x="140.0" y="288.6" font-size="12" fill="#1E2933" text-anchor="middle" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">PedidoRepositoryJdbc</text><path d="M250,219 L396,232" fill="none" stroke="#0E6F72" stroke-width="1.5" marker-end="url(#a-teal)" stroke-linejoin="round"/><text x="262" y="214" font-size="11.5" fill="#0E6F72" text-anchor="start" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">getConnection()</text><path d="M396,262 L254,285" fill="none" stroke="#0E6F72" stroke-width="1.5" marker-end="url(#a-teal)" stroke-linejoin="round"/><text x="262" y="298" font-size="11.5" fill="#0E6F72" text-anchor="start" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">close()</text><rect x="730" y="196" width="290" height="150" rx="8" fill="#F2F4F7" stroke="#8795A3" stroke-width="1"/><text x="746" y="222" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">close() no cierra: devuelve la</text><text x="746" y="241" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">conexión al pool para otro uso.</text><text x="746" y="260" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400"></text><text x="746" y="279" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">Medido con la tienda (servidor local):</text><text x="746" y="298" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">conexión nueva    ≈ 2,3 ms</text><text x="746" y="317" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">conexión del pool ≈ 0,35 ms</text></svg>
