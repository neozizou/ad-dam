h="16" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#A83A3A"/></marker></defs><text x="30" y="32" font-size="15" fill="#0E6F72" text-anchor="start" font-weight="700">Gestor embebido (H2)</text><rect x="30" y="48" width="360" height="196" rx="12" fill="#E3F1F1" stroke="#0E6F72" stroke-width="1.4" stroke-dasharray="6 4"/><text x="46" y="72" font-size="12.5" fill="#5C6B7A" text-anchor="start" font-weight="400" font-style="italic">Un solo proceso: la JVM de tu programa</text><rect x="56" y="88" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#1E2933" stroke-width="1.5"/><text x="126.0" y="120.2" font-size="14" fill="#1E2933" text-anchor="middle" font-weight="600">Tu código</text><rect x="226" y="88" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#0E6F72" stroke-width="1.5"/><text x="296.0" y="110.4" font-size="14" fill="#1E2933" text-anchor="middle" font-weight="600">Motor de H2</text><text x="296.0" y="128.6" font-size="12" fill="#5C6B7A" text-anchor="middle" font-weight="400">(una biblioteca)</text><path d="M196,116 L222,116" fill="none" stroke="#1E2933" stroke-width="1.5" marker-end="url(#a-ink)" stroke-linejoin="round"/><path d="M236,166 L342,166 L356,180 L356,228 L236,228 z" fill="#FFFFFF" stroke="#8795A3" stroke-width="1.5" stroke-linejoin="round"/><path d="M342,166 L342,180 L356,180" fill="none" stroke="#8795A3" stroke-width="1.5" stroke-linejoin="round"/><text x="296.0" y="193.425" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">tienda.mv.db</text><text x="296.0" y="210.95000000000002" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400">en datos/</text><path d="M296,144 L296,162" fill="none" stroke="#0E6F72" stroke-width="1.5" marker-end="url(#a-teal)" stroke-linejoin="round"/><text x="36" y="274" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">+ nada que instalar ni arrancar</text><text x="36" y="293" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">+ ideal para pruebas y aplicaciones</text><text x="36" y="312" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">   de un solo usuario</text><text x="36" y="331" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">– un único programa a la vez</text><text x="36" y="350" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">– los datos viven en ese equipo</text><text x="450" y="32" font-size="15" fill="#3949A0" text-anchor="start" font-weight="700">Servidor independiente (MariaDB)</text><rect x="450" y="48" width="200" height="100" rx="12" fill="#F2F4F7" stroke="#8795A3" stroke-width="1.2" stroke-dasharray="6 4"/><text x="462" y="70" font-size="12" fill="#5C6B7A" text-anchor="start" font-weight="400" font-style="italic">Proceso de tu programa</text><rect x="474" y="82" width="152" height="52" rx="8" fill="#FFFFFF" stroke="#1E2933" stroke-width="1.5"/><text x="550.0" y="102.4" font-size="14" fill="#1E2933" text-anchor="middle" font-weight="600">Tu código</text><text x="550.0" y="120.6" font-size="12" fill="#5C6B7A" text-anchor="middle" font-weight="400">+ conector</text><rect x="450" y="166" width="200" height="76" rx="12" fill="#F2F4F7" stroke="#8795A3" stroke-width="1.2" stroke-dasharray="6 4"/><text x="462" y="188" font-size="12" fill="#5C6B7A" text-anchor="start" font-weight="400" font-style="italic">Otros clientes</text><rect x="466" y="200" width="80" height="28" rx="14.0" fill="#FFFFFF" stroke="#8795A3" stroke-width="1.5"/><text x="506.0" y="218.2" font-size="12" fill="#1E2933" text-anchor="middle" font-weight="500" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">mariadb</text><rect x="554" y="200" width="84" height="28" rx="14.0" fill="#FFFFFF" stroke="#8795A3" stroke-width="1.5"/><text x="596.0" y="218.2" font-size="12" fill="#1E2933" text-anchor="middle" font-weight="500">HeidiSQL</text><rect x="740" y="48" width="230" height="194" rx="12" fill="#E7E9F6" stroke="#3949A0" stroke-width="1.4" stroke-dasharray="6 4"/><text x="752" y="70" font-size="12" fill="#5C6B7A" text-anchor="start" font-weight="400" font-style="italic">Otro proceso, quizá otra máquina</text><rect x="766" y="82" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#3949A0" stroke-width="1.5"/><text x="856.0" y="102.4" font-size="14" fill="#1E2933" text-anchor="middle" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">mariadbd</text><text x="856.0" y="120.6" font-size="12" fill="#5C6B7A" text-anchor="middle" font-weight="400">el servidor</text><path d="M796,163 L796,219 A60.0,9 0 0 0 916,219 L916,163" fill="#E7E9F6" stroke="#3949A0" stroke-width="1.5"/><ellipse cx="856.0" cy="163" rx="60.0" ry="9" fill="#E7E9F6" stroke="#3949A0" stroke-width="1.5"/><text x="856.0" y="190.425" font-size="12.5" fill="#1E2933" text-anchor="middle" font-weight="600">datos</text><text x="856.0" y="206.9" font-size="10.5" fill="#5C6B7A" text-anchor="middle" font-weight="400">usuarios, permisos…</text><path d="M856,134 L856,150" fill="none" stroke="#3949A0" stroke-width="1.5" marker-end="url(#a-indigo)" stroke-linejoin="round"/><path d="M650,108 L762,108" fill="none" stroke="#3949A0" stroke-width="1.5" marker-end="url(#a-indigo)" marker-start="url(#a-indigo)" stroke-linejoin="round"/><path d="M650,204 L706,204 L706,120 L762,120" fill="none" stroke="#3949A0" stroke-width="1.5" marker-end="url(#a-indigo)" marker-start="url(#a-indigo)" stroke-linejoin="round"/><rect x="692.424" y="86.6" width="27.152" height="15.600000000000001" fill="#FFFFFF"/><text x="706" y="98" font-size="12" fill="#3949A0" text-anchor="middle" font-weight="400">red</text><text x="456" y="274" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">+ muchos programas y usuarios a la vez</text><text x="456" y="293" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">+ usuarios, permisos, copias de seguridad</text><text x="456" y="312" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">– hay que instalarlo, arrancarlo y administrarlo</text><text x="456" y="331" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">– cada operación viaja por la red</text></svg>
