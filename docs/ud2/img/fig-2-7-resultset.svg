none" stroke="#5C6B7A" stroke-width="1.5" marker-end="url(#a-muted)" stroke-linejoin="round"/><text x="162" y="98" font-size="12" fill="#5C6B7A" text-anchor="end" font-weight="400">antes de la primera fila</text><text x="162" y="113" font-size="11" fill="#5C6B7A" text-anchor="end" font-weight="400" font-style="italic">al ejecutar la consulta</text><path d="M170,157.0 L204,157.0" fill="none" stroke="#0E6F72" stroke-width="1.5" marker-end="url(#a-teal)" stroke-linejoin="round"/><text x="162" y="155.0" font-size="12" fill="#0E6F72" text-anchor="end" font-weight="700">fila actual</text><text x="162" y="170.0" font-size="11" fill="#5C6B7A" text-anchor="end" font-weight="400" font-style="italic">tras el segundo next()</text><path d="M170,252 L204,252" fill="none" stroke="#5C6B7A" stroke-width="1.5" marker-end="url(#a-muted)" stroke-linejoin="round"/><text x="162" y="250" font-size="12" fill="#5C6B7A" text-anchor="end" font-weight="400">después de la última</text><text x="162" y="265" font-size="11" fill="#5C6B7A" text-anchor="end" font-weight="400" font-style="italic">next() devuelve false</text><rect x="700" y="60" width="330" height="190" rx="8" fill="#F2F4F7" stroke="#8795A3" stroke-width="1"/><text x="714" y="88" font-size="12" fill="#1E2933" text-anchor="start" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">while (filas.next()) {</text><text x="714" y="109" font-size="12" fill="#1E2933" text-anchor="start" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">    String c = filas.getString("codigo");</text><text x="714" y="130" font-size="12" fill="#1E2933" text-anchor="start" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">    BigDecimal p =</text><text x="714" y="151" font-size="12" fill="#1E2933" text-anchor="start" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">        filas.getBigDecimal("precio");</text><text x="714" y="172" font-size="12" fill="#1E2933" text-anchor="start" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">    int s = filas.getInt(4);</text><text x="714" y="193" font-size="12" fill="#1E2933" text-anchor="start" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">}</text><text x="714" y="222" font-size="11.5" fill="#5C6B7A" text-anchor="start" font-weight="400" font-style="italic">Los get leen columnas de la fila actual,</text><text x="714" y="237" font-size="11.5" fill="#5C6B7A" text-anchor="start" font-weight="400" font-style="italic">por nombre o por posición (desde 1).</text></svg>
