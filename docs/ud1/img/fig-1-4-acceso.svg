" refY="5" markerWidth="16" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#A83A3A"/></marker></defs><text x="20" y="30" font-size="14" fill="#1E2933" text-anchor="start" font-weight="700">Acceso secuencial: para llegar al tercer producto hay que leer los anteriores</text><rect x="20" y="45" width="150" height="40" rx="0" fill="#FFFFFF" stroke="#8795A3" stroke-width="1.2"/><text x="95.0" y="70" font-size="12" fill="#1E2933" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">TEC01;Teclado…</text><rect x="170" y="45" width="210" height="40" rx="0" fill="#FFFFFF" stroke="#8795A3" stroke-width="1.2"/><text x="275.0" y="70" font-size="12" fill="#1E2933" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">RAT01;Ratón inalámbrico…</text><rect x="380" y="45" width="120" height="40" rx="0" fill="#E3F1F1" stroke="#0E6F72" stroke-width="1.2"/><text x="440.0" y="70" font-size="12" fill="#1E2933" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">MON01;Mon…</text><rect x="500" y="45" width="180" height="40" rx="0" fill="#FFFFFF" stroke="#8795A3" stroke-width="1.2"/><text x="590.0" y="70" font-size="12" fill="#1E2933" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">CAB01;Cable USB-C…</text><rect x="680" y="45" width="160" height="40" rx="0" fill="#FFFFFF" stroke="#8795A3" stroke-width="1.2"/><text x="760.0" y="70" font-size="12" fill="#1E2933" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">HUB01;Hub…</text><path d="M20,105 L365,105 L395,105" fill="none" stroke="#A35F00" stroke-width="1.5" marker-end="url(#a-amber)" stroke-linejoin="round"/><text x="25" y="125" font-size="12" fill="#A35F00" text-anchor="start" font-weight="400" font-style="italic">lectura de principio a fin: no se sabe dónde empieza cada producto porque cada uno mide distinto</text><text x="20" y="165" font-size="14" fill="#1E2933" text-anchor="start" font-weight="700">Acceso aleatorio: registros de longitud fija (84 bytes); el registro n empieza en n × 84</text><rect x="20" y="215" width="165" height="40" rx="0" fill="#FFFFFF" stroke="#3949A0" stroke-width="1.2"/><text x="102" y="240" font-size="12.5" fill="#1E2933" text-anchor="middle" font-weight="400">registro 0</text><text x="20" y="273" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">0</text><rect x="185" y="215" width="165" height="40" rx="0" fill="#FFFFFF" stroke="#3949A0" stroke-width="1.2"/><text x="267" y="240" font-size="12.5" fill="#1E2933" text-anchor="middle" font-weight="400">registro 1</text><text x="185" y="273" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">84</text><rect x="350" y="215" width="165" height="40" rx="0" fill="#E3F1F1" stroke="#0E6F72" stroke-width="1.2"/><text x="432" y="240" font-size="12.5" fill="#1E2933" text-anchor="middle" font-weight="600">registro 2</text><text x="350" y="273" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">168</text><rect x="515" y="215" width="165" height="40" rx="0" fill="#FFFFFF" stroke="#3949A0" stroke-width="1.2"/><text x="597" y="240" font-size="12.5" fill="#1E2933" text-anchor="middle" font-weight="400">registro 3</text><text x="515" y="273" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">252</text><rect x="680" y="215" width="165" height="40" rx="0" fill="#FFFFFF" stroke="#3949A0" stroke-width="1.2"/><text x="762" y="240" font-size="12.5" fill="#1E2933" text-anchor="middle" font-weight="400">registro 4</text><text x="680" y="273" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">336</text><text x="845" y="273" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">420</text><path d="M20,211 C120,175 250,175 350,211" fill="none" stroke="#0E6F72" stroke-width="1.6" marker-end="url(#a-teal)"/><text x="186" y="305" font-size="12.5" fill="#0E6F72" text-anchor="middle" font-weight="700" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">seek(2 × 84) salta directamente al byte 168</text><text x="20" y="348" font-size="13.5" fill="#1E2933" text-anchor="start" font-weight="700">Dentro de cada registro</text><rect x="20" y="360" width="95" height="46" rx="0" fill="#F2F4F7" stroke="#1E2933" stroke-width="1.2"/><text x="67.5" y="380" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="700">código</text><text x="67.5" y="397" font-size="11" fill="#5C6B7A" text-anchor="middle" font-weight="400">6 chars = 12 B</text><text x="20" y="422" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">0</text><rect x="115" y="360" width="420" height="46" rx="0" fill="#F2F4F7" stroke="#1E2933" stroke-width="1.2"/><text x="325.0" y="380" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="700">nombre</text><text x="325.0" y="397" font-size="11" fill="#5C6B7A" text-anchor="middle" font-weight="400">30 chars = 60 B</text><text x="115" y="422" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">12</text><rect x="535" y="360" width="95" height="46" rx="0" fill="#FBEFD9" stroke="#1E2933" stroke-width="1.2"/><text x="582.5" y="380" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="700">precio</text><text x="582.5" y="397" font-size="11" fill="#5C6B7A" text-anchor="middle" font-weight="400">long = 8 B</text><text x="535" y="422" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">72</text><rect x="630" y="360" width="95" height="46" rx="0" fill="#E7E9F6" stroke="#1E2933" stroke-width="1.2"/><text x="677.5" y="380" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="700">stock</text><text x="677.5" y="397" font-size="11" fill="#5C6B7A" text-anchor="middle" font-weight="400">int = 4 B</text><text x="630" y="422" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">80</text><text x="725" y="422" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">84</text><text x="745" y="388" font-size="12" fill="#1E2933" text-anchor="start" font-weight="400">cambiar el stock del registro n:</text><text x="745" y="406" font-size="12" fill="#0E6F72" text-anchor="start" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">seek(n × 84 + 80) y writeInt</text></svg>
