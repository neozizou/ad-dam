"1" refY="5" markerWidth="16" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#A83A3A"/></marker></defs><text x="20" y="30" font-size="14.5" fill="#1E2933" text-anchor="start" font-weight="700">Guardar sin riesgo de dejar el fichero a medias</text><path d="M20,60 L176,60 L190,74 L190,130 L20,130 z" fill="#FFFFFF" stroke="#8795A3" stroke-width="1.5" stroke-linejoin="round"/><path d="M176,60 L176,74 L190,74" fill="none" stroke="#8795A3" stroke-width="1.5" stroke-linejoin="round"/><text x="105.0" y="83.95" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">productos.json</text><text x="105.0" y="101.475" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400">versión anterior,</text><text x="105.0" y="116.425" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400">intacta</text><rect x="250" y="60" width="230" height="70" rx="8" fill="#E3F1F1" stroke="#0E6F72" stroke-width="1.5"/><text x="365.0" y="89.4" font-size="14" fill="#1E2933" text-anchor="middle" font-weight="600">1. Escribir el temporal</text><text x="365.0" y="107.6" font-size="12" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">productos.json.tmp</text><rect x="540" y="60" width="230" height="70" rx="8" fill="#E3F1F1" stroke="#0E6F72" stroke-width="1.5"/><text x="655.0" y="89.4" font-size="14" fill="#1E2933" text-anchor="middle" font-weight="600">2. Mover encima</text><text x="655.0" y="107.6" font-size="12" fill="#5C6B7A" text-anchor="middle" font-weight="400" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">Files.move(…, ATOMIC_MOVE)</text><path d="M830,60 L986,60 L1000,74 L1000,130 L830,130 z" fill="#E3F1F1" stroke="#0E6F72" stroke-width="1.5" stroke-linejoin="round"/><path d="M986,60 L986,74 L1000,74" fill="none" stroke="#0E6F72" stroke-width="1.5" stroke-linejoin="round"/><text x="915.0" y="83.95" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">productos.json</text><text x="915.0" y="101.475" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400">versión nueva,</text><text x="915.0" y="116.425" font-size="11.5" fill="#5C6B7A" text-anchor="middle" font-weight="400">completa</text><path d="M480,95 L536,95" fill="none" stroke="#0E6F72" stroke-width="1.5" marker-end="url(#a-teal)" stroke-linejoin="round"/><path d="M770,95 L826,95" fill="none" stroke="#0E6F72" stroke-width="1.5" marker-end="url(#a-teal)" stroke-linejoin="round"/><rect x="250" y="170" width="520" height="80" rx="8" fill="#F8E3E3" stroke="#A83A3A" stroke-width="1.2"/><text x="265" y="195" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="600">Si algo falla en el paso 1 (disco lleno, se va la luz, excepción…)</text><text x="265" y="218" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">el temporal se borra y productos.json conserva la versión anterior completa.</text><text x="265" y="239" font-size="12.5" fill="#A83A3A" text-anchor="start" font-weight="400" font-style="italic">Escribiendo directamente encima, quedaría un fichero cortado e ilegible.</text><path d="M365,130 L365,166" fill="none" stroke="#A83A3A" stroke-width="1.5" marker-end="url(#a-rose)" stroke-linejoin="round"/><text x="20" y="285" font-size="12.5" fill="#5C6B7A" text-anchor="start" font-weight="400" font-style="italic">El movimiento atómico ocurre de una vez: quien lea el fichero ve la versión vieja o la nueva, nunca una mezcla.</text></svg>
