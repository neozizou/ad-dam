"5" markerWidth="16" markerHeight="10" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#A83A3A"/></marker></defs><rect x="15" y="15" width="790" height="345" rx="14" fill="#FFFFFF" stroke="#0E6F72" stroke-width="2"/><text x="35" y="45" font-size="17" fill="#0E6F72" text-anchor="start" font-weight="700">JDK (Java Development Kit)</text><text x="785" y="45" font-size="12.5" fill="#5C6B7A" text-anchor="end" font-weight="400" font-style="italic">lo que instalas para programar</text><rect x="35" y="65" width="268" height="275" rx="10" fill="#E3F1F1" stroke="#0E6F72" stroke-width="1.2"/><text x="169" y="92" font-size="14" fill="#1E2933" text-anchor="middle" font-weight="600">Herramientas de desarrollo</text><rect x="50" y="108" width="80" height="28" rx="14.0" fill="#FFFFFF" stroke="#0E6F72" stroke-width="1.5"/><text x="90.0" y="126.55" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="500" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">javac</text><text x="140" y="127" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">compila .java → .class</text><rect x="50" y="145" width="80" height="28" rx="14.0" fill="#FFFFFF" stroke="#0E6F72" stroke-width="1.5"/><text x="90.0" y="163.55" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="500" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">java</text><text x="140" y="164" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">lanza la JVM</text><rect x="50" y="182" width="80" height="28" rx="14.0" fill="#FFFFFF" stroke="#0E6F72" stroke-width="1.5"/><text x="90.0" y="200.55" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="500" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">jshell</text><text x="140" y="201" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">intérprete interactivo</text><rect x="50" y="219" width="80" height="28" rx="14.0" fill="#FFFFFF" stroke="#0E6F72" stroke-width="1.5"/><text x="90.0" y="237.55" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="500" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">javadoc</text><text x="140" y="238" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">genera documentación</text><rect x="50" y="256" width="80" height="28" rx="14.0" fill="#FFFFFF" stroke="#0E6F72" stroke-width="1.5"/><text x="90.0" y="274.55" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="500" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">jar</text><text x="140" y="275" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">empaqueta en .jar</text><rect x="50" y="293" width="80" height="28" rx="14.0" fill="#FFFFFF" stroke="#0E6F72" stroke-width="1.5"/><text x="90.0" y="311.55" font-size="13" fill="#1E2933" text-anchor="middle" font-weight="500" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">javap</text><text x="140" y="312" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">muestra el bytecode</text><rect x="318" y="65" width="467" height="275" rx="10" fill="#F2F4F7" stroke="#8795A3" stroke-width="1.2"/><text x="551" y="92" font-size="14" fill="#1E2933" text-anchor="middle" font-weight="600">Lo necesario para ejecutar</text><rect x="335" y="108" width="432" height="105" rx="8" fill="#FFFFFF" stroke="#0E6F72" stroke-width="1.5"/><text x="350" y="132" font-size="14" fill="#1E2933" text-anchor="start" font-weight="600">JVM (máquina virtual de Java)</text><text x="350" y="156" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">• carga las clases y verifica el bytecode</text><text x="350" y="174" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">• lo interpreta y compila al vuelo (JIT) lo que más se usa</text><text x="350" y="192" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">• libera la memoria con el recolector de basura</text><rect x="335" y="225" width="432" height="100" rx="8" fill="#FFFFFF" stroke="#3949A0" stroke-width="1.5"/><text x="350" y="249" font-size="14" fill="#1E2933" text-anchor="start" font-weight="600">Biblioteca estándar (módulos)</text><text x="350" y="270" font-size="12.5" fill="#3949A0" text-anchor="start" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">java.base</text><text x="445" y="270" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">String, colecciones, java.time, ficheros…</text><text x="350" y="289" font-size="12.5" fill="#3949A0" text-anchor="start" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">java.sql</text><text x="445" y="289" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">JDBC (UD2)</text><text x="350" y="308" font-size="12.5" fill="#3949A0" text-anchor="start" font-weight="600" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">java.xml</text><text x="445" y="308" font-size="12.5" fill="#1E2933" text-anchor="start" font-weight="400">DOM y StAX (UD1)</text></svg>
