name: Publicar el sitio en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "herramientas/web/**"
      - ".github/workflows/publicar-sitio.yml"
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: herramientas/web/requirements.txt

      - name: Instalar MkDocs y el tema Material
        run: pip install -r herramientas/web/requirements.txt

      - name: Construir el sitio (se detiene si hay enlaces o anclas rotos)
        run: mkdocs build --strict

      - name: Subir el resultado
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
